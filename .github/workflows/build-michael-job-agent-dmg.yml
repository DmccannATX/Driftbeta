name: Build Michael Job Agent DMG v1.0.1
on:
  push:
    branches:
      - build/michael-job-agent-dmg
jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct reviewed source
        run: |
          cat mja-v101.part00 mja-v101.part01 mja-v101.part02 mja-v101.part03 mja-v101.part04 mja-v101.part05 > /tmp/mja-source.b64
          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/mja-source.zip', Buffer.from(fs.readFileSync('/tmp/mja-source.b64','utf8'),'base64'))"
          echo "82fbec771c569c72017fd55bd038dee248da22277dd7c9d10e349f18f8148ff9  /tmp/mja-source.zip" | shasum -a 256 -c -
          rm -rf /tmp/mja-src
          mkdir -p /tmp/mja-src
          unzip -q /tmp/mja-source.zip -d /tmp/mja-src
          cp mja-build-dmg-v101.sh /tmp/mja-src/michael-job-agent-desktop-v1.0.1/build-dmg.sh
          cp mja-package-v101.json /tmp/mja-src/michael-job-agent-desktop-v1.0.1/package.json
          chmod +x /tmp/mja-src/michael-job-agent-desktop-v1.0.1/build-dmg.sh
      - name: Install build tooling
        working-directory: /tmp/mja-src/michael-job-agent-desktop-v1.0.1
        run: npm install --no-audit --no-fund
      - name: Verify source and unit tests
        working-directory: /tmp/mja-src/michael-job-agent-desktop-v1.0.1
        run: npm run verify
      - name: Audit production dependencies
        working-directory: /tmp/mja-src/michael-job-agent-desktop-v1.0.1
        run: npm audit --omit=dev --audit-level=high
      - name: Build Apple Silicon DMG
        working-directory: /tmp/mja-src/michael-job-agent-desktop-v1.0.1
        run: bash ./build-dmg.sh
      - name: Validate packaged application and DMG
        working-directory: /tmp/mja-src/michael-job-agent-desktop-v1.0.1
        run: |
          set -euo pipefail
          APP='dist/Michael Job Agent-darwin-arm64/Michael Job Agent.app'
          DMG='dist/Michael-Job-Agent-1.0.1-arm64.dmg'
          test -d "$APP"
          test -f "$APP/Contents/Resources/app.asar"
          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Michael Job Agent" | grep -q 'arm64'
          "$APP/Contents/MacOS/Michael Job Agent" > /tmp/mja-smoke.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/mja-smoke.log
            wait "$PID" || true
            echo 'Packaged app exited during smoke test' >&2
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
          test -f "$DMG"
          shasum -a 256 -c "${DMG}.sha256"
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; rmdir "$MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$MOUNT/Michael Job Agent.app"
          test -L "$MOUNT/Applications"
          /usr/bin/codesign --verify --deep --strict "$MOUNT/Michael Job Agent.app"
          hdiutil detach "$MOUNT" >/dev/null
          rmdir "$MOUNT"
          trap - EXIT
      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp '/tmp/mja-src/michael-job-agent-desktop-v1.0.1/dist/Michael-Job-Agent-1.0.1-arm64.dmg' "$GITHUB_WORKSPACE/out/"
          cp '/tmp/mja-src/michael-job-agent-desktop-v1.0.1/dist/Michael-Job-Agent-1.0.1-arm64.dmg.sha256' "$GITHUB_WORKSPACE/out/"
          cd /tmp/mja-src
          zip -qr "$GITHUB_WORKSPACE/out/Michael-Job-Agent-Desktop-Source-v1.0.1.zip" michael-job-agent-desktop-v1.0.1 -x '*/node_modules/*' '*/dist/*' '*/dmg-stage/*' '*.DS_Store'
      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: Michael-Job-Agent-Mac-arm64-v1.0.1
          path: out/*
          if-no-files-found: error
          retention-days: 7
